<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up · Hobbyshelf</title>
  <link rel="stylesheet" href="./css/style.css">
  <style>
    
    .btn.full { width: 100%; margin-top: 22px; }

    .auth-card {
      max-width: 420px; margin: 40px auto; background: var(--card); border: 1px solid var(--line);
      border-radius: 16px; padding: 32px;
    }
    .auth-card h2 { margin: 0 0 6px; }
    .auth-card .sub { color: var(--muted); margin: 0 0 20px; }

    .switch { font-size: 0.95rem; color: var(--muted); margin-top: 18px; text-align: center; }
    .switch a { color: var(--accent); }
    .fine { font-size: 0.85rem; color: var(--muted); margin-top: 14px; text-align: center; }
  </style>
</head>
<body>

<div id="site-header"></div>

<main>
  <div class="auth-card">
    <h2>Create your account</h2>
    <p class="sub">Start your shelf in a minute.</p>

    <form id="signup-form">
      <label for="s-name">Name</label>
      <input type="text" id="s-name" required autocomplete="name">
      <label for="s-email">Email</label>
      <input type="email" id="s-email" required autocomplete="email">
      <label for="s-pass">Password</label>
      <input type="password" id="s-pass" required minlength="6" autocomplete="new-password">
      <button class="btn full" type="submit">Sign up</button>
    </form>

    <p class="switch">Already have an account? <a href="login.html">Log in</a></p>
    <p class="fine">Accounts aren't connected yet. Any details will get you in for now.</p>
  </div>
</main>

<script>
  /* ---------- Shared helpers and storage ---------- */
  const $ = (selector) => document.querySelector(selector);

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function link(text, href, className) {
    const a = el('a', className, text);
    a.href = href;
    return a;
  }

  function readJSON(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch {
      return fallback;
    }
  }

  const Session = {
    KEY: 'hobbyshelf.user',
    get() { return readJSON(this.KEY, null); },
    start(user) { localStorage.setItem(this.KEY, JSON.stringify(user)); },
    end() { localStorage.removeItem(this.KEY); }
  };

  /* ---------- Header ---------- */
  function renderHeader() {
    const host = $('#site-header');
    if (!host) return;

    const user = Session.get();
    const header = el('header', 'top');
    const right = el('div', 'nav-right');

    if (user) {
      const signOut = el('button', 'btn ghost small', 'Sign out');
      signOut.type = 'button';
      signOut.addEventListener('click', () => {
        Session.end();
        location.href = 'index.html';
      });
      right.append(el('span', 'who', user.name), link('My shelf', 'shelf.html', 'btn small'), signOut);
    } else {
      right.append(
        link('Log in', 'login.html', 'btn ghost small'),
        link('Sign up', 'signup.html', 'btn small')
      );
    }

    header.append(link('Hobbyshelf', 'index.html', 'brand'), right);
    host.replaceChildren(header);
  }
  renderHeader();

  /* ---------- Sign up ---------- */
  if (Session.get()) location.replace('shelf.html');

  // Accounts aren't connected yet, so the details are only saved in this browser.
  $('#signup-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const name = $('#s-name').value.trim();
    const email = $('#s-email').value.trim();
    Session.start({ email, name });
    location.href = 'shelf.html';
  });
</script>
</body>
</html>
