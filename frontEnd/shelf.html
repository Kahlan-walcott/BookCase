<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Bookshelf · Hobbyshelf</title>
  <link rel="stylesheet" href="../css/styles.css"/>
  <style>
/* Bookshelf page */
.shelf-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 12px; }
.shelf-head h1 { margin: 0; font-size: 1.8rem; }
.count { color: var(--muted); font-size: 0.95rem; }
.empty-msg { text-align: center; color: var(--muted); margin: 18px 0 8px; line-height: 1.6; }

.add-panel {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 22px;
  margin: 18px 0 26px;
  max-width: 720px;
}
.add-panel h2 { margin: 0 0 4px; font-size: 1.2rem; }
.add-panel .hint { color: var(--muted); font-size: 0.9rem; margin: 0 0 6px; }
.optional { font-size: 0.8rem; color: var(--muted); }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
.form-grid .wide { grid-column: 1 / -1; }
.photo-row { display: flex; gap: 14px; align-items: center; margin-top: 14px; flex-wrap: wrap; }
.photo-preview {
  width: 70px;
  height: 100px;
  object-fit: cover;
  border-radius: 4px;
  box-shadow: 2px 2px 6px rgba(0, 0, 0, 0.25);
}
.kind-row { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 12px; font-size: 0.95rem; }
.kind-row label { margin: 0; color: var(--ink); cursor: pointer; }
.panel-actions { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
.status { min-height: 1.4em; color: var(--muted); font-size: 0.9rem; margin: 10px 0 0; }

/* Review list for books found in a shelf photo */
.review-row { display: grid; grid-template-columns: auto 1fr 1fr; gap: 8px; align-items: center; margin-bottom: 8px; }
.review-row input[type="text"] {
  width: 100%;
  padding: 8px 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fff;
  color: var(--ink);
}
.review-row input[type="checkbox"] { width: 18px; height: 18px; }

/* Shelf and books */
.shelf {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  background: linear-gradient(#e7d3b7, #dcc3a2);
  border-radius: 6px;
  overflow: hidden;
}
.slot {
  height: 210px;
  padding: 0 10px;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  border-bottom: 14px solid var(--wood);
  box-shadow: inset 0 -6px 10px rgba(0, 0, 0, 0.08);
}
.slot.empty { background: transparent; }

.book {
  position: relative;
  width: 110px;
  height: 165px;
  border-radius: 3px 6px 6px 3px;
  overflow: hidden;
  box-shadow: 3px 3px 8px rgba(0, 0, 0, 0.3);
  background: #fff;
}
.book img { width: 100%; height: 100%; object-fit: cover; display: block; }
.book .fallback {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 10px;
  color: #fff;
  background: linear-gradient(135deg, #7a3e2a, #4a2a1c);
  font-size: 0.85rem;
  line-height: 1.3;
  word-break: break-word;
}
.book .fallback small { opacity: 0.75; margin-top: 6px; font-size: 0.75rem; }
.book .remove {
  position: absolute;
  top: 4px;
  right: 4px;
  width: 24px;
  height: 24px;
  border: 0;
  border-radius: 50%;
  background: rgba(0, 0, 0, 0.6);
  color: #fff;
  cursor: pointer;
  line-height: 1;
  opacity: 0.85;
}
.book .remove:hover { opacity: 1; }

@media (max-width: 560px) {
  .form-grid { grid-template-columns: 1fr; }
  .review-row { grid-template-columns: auto 1fr; }
  .shelf { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); }
  .slot { height: 190px; }
  .book { width: 92px; height: 138px; }
}
  </style>
</head>
<body>

<div id="site-header"></div>

<main>
  <div class="shelf-head">
    <div>
      <h1>My Bookshelf</h1>
      <div class="count" id="count"></div>
    </div>
    <button class="btn" id="add-toggle" type="button">+ Add books</button>
  </div>

  <div id="add-panel" class="add-panel hidden">
    <h2>Add books</h2>
    <p class="hint">Upload a photo of a book cover or a whole shelf, or type the details yourself.</p>
    <form id="add-form">
      <div class="photo-row">
        <div>
          <label for="b-photo" style="margin-top:0">Photo</label>
          <input type="file" id="b-photo" accept="image/*" capture="environment">
        </div>
        <img id="photo-preview" class="photo-preview hidden" alt="Photo preview">
      </div>

      <div class="kind-row">
        <label><input type="radio" name="photo-kind" value="cover" checked> One book cover</label>
        <label><input type="radio" name="photo-kind" value="shelf"> A whole shelf</label>
      </div>

      <div class="form-grid" style="margin-top:14px">
        <div>
          <label for="b-title">Title <span class="optional">(not needed with a photo)</span></label>
          <input type="text" id="b-title">
        </div>
        <div>
          <label for="b-author">Author</label>
          <input type="text" id="b-author">
        </div>
        <div class="wide">
          <label for="b-isbn">ISBN <span class="optional">(optional, helps find the right cover)</span></label>
          <input type="text" id="b-isbn" inputmode="numeric">
        </div>
      </div>

      <p class="status" id="status"></p>

      <div class="panel-actions">
        <button class="btn" type="submit">Add to shelf</button>
        <button class="btn ghost" type="button" id="add-cancel">Cancel</button>
      </div>
    </form>
  </div>

  <div id="review" class="add-panel hidden">
    <h2>Books found in your photo</h2>
    <p class="hint" id="review-hint"></p>
    <div id="review-list"></div>
    <div class="panel-actions">
      <button class="btn" type="button" id="review-add">Add to shelf</button>
      <button class="btn ghost" type="button" id="review-cancel">Cancel</button>
    </div>
  </div>

  <p class="empty-msg" id="empty-msg">Your shelf is empty. Add your first book to get started.</p>
  <div class="shelf" id="shelf"></div>
</main>

<script>
  /* ---------- Shared helpers ---------- */
  const $ = (selector) => document.querySelector(selector);

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function link(text, href, className) {
    const a = el('a', className, text);
    a.href = href;
    return a;
  }

  function readJSON(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch {
      return fallback;
    }
  }

  const Session = {
    KEY: 'hobbyshelf.user',
    get() { return readJSON(this.KEY, null); },
    start(user) { localStorage.setItem(this.KEY, JSON.stringify(user)); },
    end() { localStorage.removeItem(this.KEY); }
  };

  // Calls the Hobbyshelf API. Throws an Error with the server's message on failure.
  async function api(method, path, body) {
    const headers = {};
    const user = Session.get();
    if (user) headers['X-User-Id'] = String(user.id);
    if (body !== undefined) headers['Content-Type'] = 'application/json';

    const res = await fetch(path, {
      method,
      headers,
      body: body === undefined ? undefined : JSON.stringify(body)
    });
    if (res.status === 401) {
      Session.end();
      location.replace('./login.html');
    }
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
    return data;
  }

  /* ---------- Header ---------- */
  function renderHeader() {
    const host = $('#site-header');
    if (!host) return;

    const user = Session.get();
    const header = el('header', 'top');
    const right = el('div', 'nav-right');

    if (user) {
      const signOut = el('button', 'btn ghost small', 'Sign out');
      signOut.type = 'button';
      signOut.addEventListener('click', () => {
        Session.end();
        location.href = './landingPage.html';
      });
      right.append(el('span', 'who', user.name), link('My shelf', './shelf.html', 'btn small'), signOut);
    } else {
      right.append(
        link('Log in', './login.html', 'btn ghost small'),
        link('Sign up', './signup.html', 'btn small')
      );
    }

    header.append(link('Hobbyshelf', './landingPage.html', 'brand'), right);
    host.replaceChildren(header);
  }
  renderHeader();

  /* ---------- Free photo reading (runs in the browser) ---------- */
  // Tesseract.js: free, open-source OCR. Open Library: free book catalog, no key needed.
  const OCR_SCRIPT = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
  let ocrWorkerPromise = null;

  function loadScript(src) {
    return new Promise((resolve, reject) => {
      if (window.Tesseract) return resolve();
      const script = document.createElement('script');
      script.src = src;
      script.onload = resolve;
      script.onerror = () => reject(new Error('Could not load the photo reader. Check your internet connection.'));
      document.head.append(script);
    });
  }

  function getOcrWorker() {
    if (!ocrWorkerPromise) {
      ocrWorkerPromise = loadScript(OCR_SCRIPT)
        .then(() => Tesseract.createWorker('eng'))
        .catch((err) => {
          ocrWorkerPromise = null; // allow a retry next time
          throw err;
        });
    }
    return ocrWorkerPromise;
  }

  // Returns the text lines OCR found, each with a confidence score from 0 to 100.
  async function readLines(image) {
    const worker = await getOcrWorker();
    const { data } = await worker.recognize(image);
    if (Array.isArray(data.lines) && data.lines.length) {
      return data.lines.map((line) => ({ text: line.text, confidence: line.confidence }));
    }
    return data.text.split('\n').map((text) => ({ text, confidence: 70 }));
  }

  // Keeps lines that look like real words: confident, with enough letters, no duplicates.
  function usableLines(lines) {
    const seen = new Set();
    return lines
      .map((line) => ({
        text: line.text.replace(/[|_~]+/g, ' ').replace(/\s+/g, ' ').trim(),
        confidence: line.confidence ?? 70
      }))
      .filter((line) => line.confidence >= 50 && (line.text.match(/[A-Za-z]/g) || []).length >= 4)
      .sort((a, b) => b.confidence - a.confidence)
      .filter((line) => {
        const key = line.text.toLowerCase();
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      })
      .map((line) => line.text);
  }

  // Share of the title's words (ignoring short words) that appear in the query text.
  function titleMatchScore(query, title) {
    const words = (text) => (text.toLowerCase().match(/[a-z0-9]+/g) || []).filter((w) => w.length >= 3);
    const titleWords = words(title);
    if (titleWords.length === 0) return 0;
    const queryWords = new Set(words(query));
    const found = titleWords.filter((w) => queryWords.has(w)).length;
    return found / titleWords.length;
  }

  // Searches Open Library for a book matching the text. Returns null if nothing matches well.
  async function lookupBook(query) {
    try {
      const params = new URLSearchParams({ q: query, limit: '5', fields: 'title,author_name,isbn' });
      const res = await fetch('https://openlibrary.org/search.json?' + params);
      if (!res.ok) return null;
      const data = await res.json();

      const best = (data.docs || [])
        .map((doc) => ({ doc, score: titleMatchScore(query, doc.title || '') }))
        .sort((a, b) => b.score - a.score)[0];
      if (!best || best.score < 0.6) return null;

      const isbns = best.doc.isbn || [];
      return {
        title: best.doc.title,
        author: best.doc.author_name?.[0] || '',
        isbn: isbns.find((i) => i.length === 13) || isbns[0] || '',
        matched: true
      };
    } catch (err) {
      console.warn('Catalog lookup failed', err);
      return null;
    }
  }

  // One cover photo: read the text, look up the best catalog match.
  // If nothing matches, the most confident line is used as the title and the user can correct it.
  async function readCover(image) {
    const lines = usableLines(await readLines(image));
    if (lines.length === 0) return {};
    const match = await lookupBook(lines.slice(0, 4).join(' '));
    if (match) return match;
    return { title: lines[0], author: '', isbn: '', matched: false };
  }

  // A shelf photo: every readable line becomes a candidate book.
  // Lines that match the catalog are checked by default; the rest are left for the user to decide.
  async function readShelf(image, onStatus) {
    const candidates = usableLines(await readLines(image)).slice(0, 15);
    const results = [];
    const seen = new Set();

    for (let i = 0; i < candidates.length; i++) {
      onStatus(`Checking ${i + 1} of ${candidates.length} possible books…`);
      const match = await lookupBook(candidates[i]);
      const book = match || { title: candidates[i], author: '', isbn: '', matched: false };
      const key = book.title.toLowerCase();
      if (!seen.has(key)) {
        seen.add(key);
        results.push(book);
      }
    }
    return results;
  }

  // Shrinks a photo so it reads quickly and uploads stay small. Returns a JPEG data URL.
  function resizeImage(file, maxSide) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        URL.revokeObjectURL(url);
        resolve(canvas.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = () => {
        URL.revokeObjectURL(url);
        reject(new Error('That file is not an image this browser can read.'));
      };
      img.src = url;
    });
  }

  // Tries the ISBN first, then searches Open Library by title and author.
  function imageExists(url) {
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = () => resolve(url);
      img.onerror = () => resolve(null);
      img.src = url;
    });
  }

  async function findCover({ title, author, isbn }) {
    try {
      if (isbn) {
        const clean = isbn.replace(/[^0-9Xx]/g, '');
        const found = await imageExists(`https://covers.openlibrary.org/b/isbn/${clean}-L.jpg?default=false`);
        if (found) return found;
      }
      const params = new URLSearchParams({ title, limit: '1' });
      if (author) params.set('author', author);
      const res = await fetch('https://openlibrary.org/search.json?' + params);
      const data = await res.json();
      const coverId = data.docs?.[0]?.cover_i;
      if (coverId) return await imageExists(`https://covers.openlibrary.org/b/id/${coverId}-L.jpg`);
    } catch (err) {
      console.warn('Cover lookup failed', err);
    }
    return null;
  }

  /* ---------- Shelf page ---------- */
  const user = Session.get();
  if (user) {
    initShelf();
  } else {
    location.replace('./login.html');
  }

  function initShelf() {
    let books = [];
    let loaded = false;
    let review = [];                      // books found in a shelf photo, awaiting confirmation
    const pending = new Set();            // ids of books still saving or looking up a cover

    /* Rendering */

    function render() {
      const shelf = $('#shelf');
      shelf.replaceChildren();
      $('#empty-msg').classList.toggle('hidden', !loaded || books.length > 0);
      $('#count').textContent = !loaded ? 'Loading…'
        : books.length === 0 ? 'No books yet'
        : `${books.length} ${books.length === 1 ? 'book' : 'books'}`;

      if (!loaded) return;
      if (books.length === 0) {
        for (let i = 0; i < 4; i++) shelf.append(makeSlot(null)); // empty boards
      } else {
        books.forEach((book) => shelf.append(makeSlot(makeBook(book))));
      }
    }

    function makeSlot(content) {
      const slot = el('div', content ? 'slot' : 'slot empty');
      if (content) slot.append(content);
      return slot;
    }

    function makeBook(book) {
      const node = el('div', 'book');
      node.title = book.author ? `${book.title} by ${book.author}` : book.title;

      if (book.cover) {
        const img = el('img');
        img.src = book.cover;
        img.alt = book.title;
        node.append(img);
      } else {
        const searching = pending.has(book.id);
        const fallback = el('div', 'fallback');
        fallback.append(el('span', '', searching ? 'Finding cover…' : book.title));
        if (!searching && book.author) fallback.append(el('small', '', book.author));
        node.append(fallback);
      }

      const remove = el('button', 'remove', '×');
      remove.type = 'button';
      remove.disabled = pending.has(book.id);
      remove.setAttribute('aria-label', `Remove ${book.title}`);
      remove.addEventListener('click', async () => {
        try {
          await api('DELETE', `/api/books/${book.id}`);
          books = books.filter((b) => b !== book);
          render();
        } catch (err) {
          alert(err.message);
        }
      });
      node.append(remove);
      return node;
    }

    /* Add panel */

    function openPanel(open) {
      $('#add-panel').classList.toggle('hidden', !open);
      $('#add-toggle').classList.toggle('hidden', open);
    }

    function closePanel() {
      $('#add-form').reset();
      setPreview(null);
      setStatus('');
      openPanel(false);
    }

    function setStatus(text) {
      $('#status').textContent = text;
    }

    function setPreview(file) {
      const img = $('#photo-preview');
      if (img.src.startsWith('blob:')) URL.revokeObjectURL(img.src);
      if (file) {
        img.src = URL.createObjectURL(file);
        img.classList.remove('hidden');
      } else {
        img.removeAttribute('src');
        img.classList.add('hidden');
      }
    }

    // No photo: the title is required and one book is added.
    // Cover photo: the book is read from the photo, and the photo becomes its cover.
    // Shelf photo: every book found is listed for review first.
    async function submitForm(event) {
      event.preventDefault();
      const typed = {
        title: $('#b-title').value.trim(),
        author: $('#b-author').value.trim(),
        isbn: $('#b-isbn').value.trim()
      };
      const file = $('#b-photo').files[0];

      if (!file) {
        if (!typed.title) return alert('Enter a title, or upload a photo of a cover or shelf.');
        closePanel();
        return addBooks([typed]);
      }

      const kind = document.querySelector('input[name="photo-kind"]:checked').value;
      const submit = $('#add-form button[type="submit"]');
      submit.disabled = true;

      try {
        const photo = await resizeImage(file, 1600);

        if (kind === 'cover') {
          setStatus('Reading the cover…');
          const found = await readCover(photo);
          const item = {
            title: typed.title || found.title || '',
            author: typed.author || found.author || '',
            isbn: typed.isbn || found.isbn || '',
            cover: photo
          };
          if (!item.title) return alert('We could not read a title from that photo. Type one in and try again.');
          closePanel();
          return addBooks([item]);
        }

        setStatus('Reading the shelf…');
        const found = await readShelf(photo, setStatus);
        if (found.length === 0) {
          return alert('We could not read any books in that photo. Try a closer, straighter picture, or type the titles.');
        }
        showReview(found);
      } catch (err) {
        alert(err.message);
      } finally {
        submit.disabled = false;
        setStatus('');
      }
    }

    /* Review step for shelf photos */

    function showReview(found) {
      review = found.map((book) => ({ ...book, keep: book.matched }));
      openPanel(false);
      $('#review').classList.remove('hidden');
      const matched = found.filter((b) => b.matched).length;
      $('#review-hint').textContent =
        `${matched} matched a book in the catalog and are checked. Unchecked lines may be shelf labels or noise. Fix any titles before adding.`;
      renderReview();
    }

    function renderReview() {
      const list = $('#review-list');
      list.replaceChildren();

      review.forEach((item) => {
        const row = el('div', 'review-row');

        const check = el('input');
        check.type = 'checkbox';
        check.checked = item.keep;
        check.setAttribute('aria-label', 'Add this book');
        check.addEventListener('change', () => {
          item.keep = check.checked;
          updateReviewButton();
        });

        const title = el('input');
        title.type = 'text';
        title.value = item.title;
        title.placeholder = 'Title';
        title.addEventListener('input', () => { item.title = title.value; updateReviewButton(); });

        const author = el('input');
        author.type = 'text';
        author.value = item.author;
        author.placeholder = 'Author';
        author.addEventListener('input', () => { item.author = author.value; });

        row.append(check, title, author);
        list.append(row);
      });
      updateReviewButton();
    }

    function updateReviewButton() {
      const count = review.filter((b) => b.keep && b.title.trim()).length;
      const button = $('#review-add');
      button.disabled = count === 0;
      button.textContent = count === 0 ? 'Nothing selected'
        : `Add ${count} ${count === 1 ? 'book' : 'books'} to shelf`;
    }

    function closeReview() {
      review = [];
      $('#review').classList.add('hidden');
      closePanel();
    }

    async function confirmReview() {
      const items = review
        .filter((b) => b.keep && b.title.trim())
        .map((b) => ({ title: b.title.trim(), author: b.author.trim(), isbn: b.isbn || '' }));
      closeReview();
      await addBooks(items);
    }

    /* Saving books */

    // Adds each item to the shelf one at a time. Items with a cover keep it;
    // the others get a cover looked up from Open Library.
    async function addBooks(items) {
      const placeholders = items.map((item) => ({
        id: 'tmp-' + Date.now() + Math.random(),
        title: item.title,
        author: item.author || '',
        isbn: item.isbn || '',
        cover: null
      }));
      books.push(...placeholders);
      placeholders.forEach((p) => pending.add(p.id));
      render();

      for (let i = 0; i < items.length; i++) {
        await saveBook(placeholders[i], items[i]);
      }
    }

    async function saveBook(placeholder, item) {
      let saved = null;
      try {
        saved = await api('POST', '/api/books', {
          title: item.title,
          author: item.author || '',
          isbn: item.isbn || '',
          cover: item.cover || null
        });
        books[books.indexOf(placeholder)] = saved;
        pending.delete(placeholder.id);
        pending.add(saved.id);
        render();

        if (!saved.cover) {
          const found = await findCover(saved);
          if (found) {
            await api('PATCH', `/api/books/${saved.id}`, { cover: found });
            saved.cover = found;
          }
        }
      } catch (err) {
        books = books.filter((b) => b !== placeholder);
        alert(`Could not add "${item.title}": ${err.message}`);
      } finally {
        pending.delete(placeholder.id);
        if (saved) pending.delete(saved.id);
        render();
      }
    }

    /* Wiring */

    $('#add-toggle').addEventListener('click', () => openPanel(true));
    $('#add-cancel').addEventListener('click', closePanel);
    $('#b-photo').addEventListener('change', (e) => setPreview(e.target.files[0]));
    $('#add-form').addEventListener('submit', submitForm);
    $('#review-add').addEventListener('click', confirmReview);
    $('#review-cancel').addEventListener('click', closeReview);

    /* Load the user's books */
    render();
    api('GET', '/api/books')
      .then((data) => { books = data; })
      .catch((err) => alert(err.message))
      .finally(() => { loaded = true; render(); });
  }
</script>
</body>
</html>
