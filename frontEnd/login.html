<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · Hobbyshelf</title>
  <link rel="stylesheet" href="../css/styles.css"/>
  <style>
    .btn.full { width: 100%; margin-top: 22px; }

    .auth-card {
      max-width: 420px; margin: 40px auto; background: var(--card); border: 1px solid var(--line);
      border-radius: 16px; padding: 32px;
    }
    .auth-card h2 { margin: 0 0 6px; }
    .auth-card .sub { color: var(--muted); margin: 0 0 20px; }
    .switch { font-size: 0.95rem; color: var(--muted); margin-top: 18px; text-align: center; }
    .switch a { color: var(--accent); }
    .fine { font-size: 0.85rem; color: var(--muted); margin-top: 14px; text-align: center; }
  </style>
</head>
<body>

<div id="site-header"></div>

<main>
  <div class="auth-card">
    <h2>Welcome back</h2>
    <p class="sub">Log in to see your shelf.</p>

    <form id="login-form">
      <label for="l-email">Email</label>
      <input type="email" id="l-email" required autocomplete="email">
      <label for="l-pass">Password</label>
      <input type="password" id="l-pass" required minlength="6" autocomplete="current-password">
      <button class="btn full" type="submit">Log in</button>
    </form>

    <p class="switch">New here? <a href="./signup.html">Create an account</a></p>
    <p class="fine">Accounts aren't connected yet. Any details will get you in for now.</p>
  </div>
</main>

<script>
  /* ---------- Shared helpers ---------- */
  const $ = (selector) => document.querySelector(selector);

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function link(text, href, className) {
    const a = el('a', className, text);
    a.href = href;
    return a;
  }

  function readJSON(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch {
      return fallback;
    }
  }

  const Session = {
    KEY: 'hobbyshelf.user',
    get() { return readJSON(this.KEY, null); },
    start(user) { localStorage.setItem(this.KEY, JSON.stringify(user)); },
    end() { localStorage.removeItem(this.KEY); }
  };


  async function api(method, path, body) {
    const headers = {};
    const user = Session.get();
    if (user) headers['X-User-Id'] = String(user.id);
    if (body !== undefined) headers['Content-Type'] = 'application/json';

    const res = await fetch(path, {
      method,
      headers,
      body: body === undefined ? undefined : JSON.stringify(body)
    });
    if (res.status === 401) {
      Session.end();
      location.replace('./login.html');
    }
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
    return data;
  }


  /* ---------- Header ---------- */
  function renderHeader() {
    const host = $('#site-header');
    if (!host) return;

    const user = Session.get();
    const header = el('header', 'top');
    const right = el('div', 'nav-right');

    if (user) {
      const signOut = el('button', 'btn ghost small', 'Sign out');
      signOut.type = 'button';
      signOut.addEventListener('click', () => {
        Session.end();
        location.href = './landingPage.html';
      });
      right.append(el('span', 'who', user.name), link('My shelf', './shelf.html', 'btn small'), signOut);
    } else {
      right.append(
        link('Log in', './login.html', 'btn ghost small'),
        link('Sign up', './signup.html', 'btn small')
      );
    }

    header.append(link('Hobbyshelf', './landingPage.html', 'brand'), right);
    host.replaceChildren(header);
  }
  renderHeader();

  // Calls the Hobbyshelf API. Throws an Error with the server's message on failure.
  async function api(method, path, body) {
    const headers = {};
    const user = Session.get();
    if (user) headers['X-User-Id'] = String(user.id);
    if (body !== undefined) headers['Content-Type'] = 'application/json';

    const res = await fetch(path, {
      method,
      headers,
      body: body === undefined ? undefined : JSON.stringify(body)
    });
    if (res.status === 401) {
      Session.end();
      location.replace('./login.html');
    }
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
    return data;
  }


  /* ---------- Log in ---------- */
  if (Session.get()) location.replace('./shelf.html');

  // Accounts aren't connected yet, so any email logs you in for now.
  $('#login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    try {
      const user = await api('POST', '/api/login', { email: $('#l-email').value.trim() });
      Session.start(user);
      location.href = './shelf.html';
    } catch (err) {
      alert(err.message);
    }
  });
</script>
</body>
</html>
